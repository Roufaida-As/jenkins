buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.sun.mail:javax.mail:1.6.2'
    }
}
plugins {
    id 'java'
    id 'com.github.spacialcircumstances.gradle-cucumber-reporting' version '0.1.25'
    id 'jacoco'
    id 'org.sonarqube' version '4.4.1.3373'
    id 'maven-publish'
    id 'io.github.oleksiiparf.slack-webhook' version '1.0.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}
cucumberReports {
    outputDir = file('build/reports/cucumber')
    buildId = '0'
    reports = files('reports/example-report.json')
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "TP5-OGL"
        property "sonar.projectName", "TP5-OGL"
        property "sonar.host.url", "http://localhost:9000/"
        property "sonar.sources", "src/main/java"
        property "sonar.test", "src/test/java"
        property "sonar.java.binaries", "build/classes"
        property "sonar.junit.reportPaths", "build/test-results/test"
        property "sonar.jacoco.reportPaths", "build/jacoco/test.exec"
    }
}


dependencies {
    testImplementation 'io.cucumber:cucumber-java:6.0.0'
    testImplementation 'io.cucumber:cucumber-junit:6.0.0'
    testImplementation 'junit:junit:4.12'

}

tasks.named('sonar') {
    dependsOn test
}

publishing {
    repositories {
        maven {
            url 'https://mymavenrepo.com/repo/cEmjfkxugPlzLxXg1A2B/'
            credentials {
                username 'myMavenRepo'
                password 'test0005'
            }
        }
    }

    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}


task sendEmailNotification {
    doLast {
        def emailConfig = [
                smtp_host: 'smtp.gmail.com',
                smtp_port: '587',
                username: 'mr_asbar@esi.dz',
                password: 'ljpc bnuc ibxl bwhl',
                recipient: 'h_mokeddem@esi.dz',
                from: 'mr_asbar@esi.dz'
        ]

        def props = new Properties()
        props.put("mail.smtp.host", emailConfig.smtp_host)
        props.put("mail.smtp.port", emailConfig.smtp_port)
        props.put("mail.smtp.auth", "true")
        props.put("mail.smtp.starttls.enable", "true")

        props.put("mail.smtp.ssl.trust", emailConfig.smtp_host)
        props.put("mail.smtp.ssl.protocols", "TLSv1.2")

        try {
            def authenticator = new javax.mail.Authenticator() {
                protected javax.mail.PasswordAuthentication getPasswordAuthentication() {
                    return new javax.mail.PasswordAuthentication(
                            emailConfig.username,
                            emailConfig.password
                    )
                }
            }

            def session = javax.mail.Session.getInstance(props, authenticator)
            def message = new javax.mail.internet.MimeMessage(session)

            message.setFrom(new javax.mail.internet.InternetAddress(emailConfig.from))
            message.setRecipients(
                    javax.mail.Message.RecipientType.TO,
                    javax.mail.internet.InternetAddress.parse(emailConfig.recipient)
            )

            message.setSubject("Déploiement réussi - ${project.name} v${project.version}")

            def emailBody = """
Bonjour,

Le déploiement de la librairie a été effectué avec succès par ASBAR ROUFAIDA.

Détails du déploiement:
- Projet: ${project.name}
- Groupe: ${project.group}
- Version: ${project.version}
- Date: ${new Date().format('dd/MM/yyyy HH:mm:ss')}

La librairie est maintenant disponible sur le repository Maven.

Repository URL: https://mymavenrepo.com/repo/cEmjfkxugPlzLxXg1A2B/

Pour utiliser cette librairie, on ajoute:
implementation "${project.group}:${project.name}:${project.version}"

            """

            message.setText(emailBody)

            javax.mail.Transport.send(message)
            println "Email de notification envoyé avec succès à ${emailConfig.recipient}"

        } catch (Exception e) {
            println "Erreur lors de l'envoi de l'email: ${e.message}"
            e.printStackTrace()
        }
    }
}